name: SwimTrack
options:
  bundleIdPrefix: pt.rjp
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 2.2.0
targets:
  SwimTrack:
    type: application
    platform: iOS
    sources: [SwimTrackIOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.rjp.swimtrack
        PRODUCT_NAME: SwimTrack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwimTrack
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
